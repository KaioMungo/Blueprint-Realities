<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Design de Interiores</title>
    <link rel="stylesheet" href="../CSS/prompt.css">
</head>
<body>
    <div class="container_formulario">
        <form class="formulario" id="formulario">
            <h2>Gerador de Imagem para Design de Interiores</h2>
            
            <div class="input_grid">
                <div class="form_group">
                    <label for="orcamento">Orçamento (R$)</label>
                    <input type="number" id="orcamento" name="orcamento" required placeholder="Ex: 15000" />
                </div>
                <div class="form_group">
                    <label for="paleta_cores">Paleta de Cores</label>
                    <input type="text" id="paleta_cores" name="paleta_cores" placeholder="Ex: azul, branco, cinza" required />
                </div>
                <div class="form_group">
                    <label for="metragem">Metragem (m²)</label>
                    <input type="number" id="metragem" name="metragem" required placeholder="Ex: 37 m²" />
                </div>
                <div class="form_group">
                    <label for="estilo">Estilo</label>
                    <select id="estilo" name="estilo" required>
                        <option value="" disabled selected>Selecione um estilo</option>
                        <option value="moderno">Moderno</option>
                        <option value="rustico">Rústico</option>
                        <option value="minimalista">Minimalista</option>
                        <option value="industrial">Industrial</option>
                        <option value="contemporaneo">Contemporâneo</option>
                    </select>
                </div>
            </div>

            <div class="form_group_upload">
                <label for="file" class="file_upload_label">
                    <span>Clique para enviar uma imagem ou arraste e solte</span>
                </label>
                <input type="file" id="file" name="img" accept="image/*" required/>
                <span id="file_name">Nenhum arquivo selecionado</span>
            </div>

            <button type="submit" class="botao_gerar">Gerar Imagem</button>

        </form>

    </div>
    
    <div class="logo_container">
        <img src="../img/logo.png" alt="Logo">
        <h3>Blueprint Realities</h3>
    </div>

    <div id="resultado_imagem"></div>
    
    <script src="../JS/prompt.js"></script>
</body>
</html>
